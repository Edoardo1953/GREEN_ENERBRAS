<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN ENERBRAS ONE SCSp</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="admin/Loghi/Green Enerbras solo logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=250">
    
    <!-- Firebase SDKs v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Auth Logic -->
    <script src="auth.js?v=250"></script>

    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .landing-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .landing-subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            text-align: left;
        }
        .form-group {
            margin-top: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            margin-top: 2rem;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: var(--accent-green-hover);
        }
        .error-message {
            color: #ef4444;
            margin-top: 1rem;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 3rem;">
            <img src="admin/Loghi/Green Enerbras solo logo.png" alt="Logo" style="height: 100px; filter: grayscale(1) invert(1) brightness(10); mix-blend-mode: screen;">
            <div style="text-align: left;">
                <h1 class="landing-title" style="margin: 0; line-height: 1;">GREEN ENERBRAS ONE</h1>
                <p class="landing-subtitle" style="margin-bottom: 0; margin-top: 0.5rem;">Portale Investimenti</p>
            </div>
        </div>

        <div class="login-box glass-panel">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem;">Accedi</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Inserisci le tue credenziali per entrare nel portale.</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">ID Utente</label>
                    <input type="text" id="username" required placeholder="Inserisci il tuo ID">
                </div>
                                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" required placeholder="Inserisci la password" style="width: 100%; padding-right: 40px;">
                        <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div id="error-msg" class="error-message"></div>

                <button type="submit" class="btn-login" id="submit-btn">Accedi al Portale</button>
            </form>
        </div>
    </div>

    <script>
        // PWA Service Worker: UNREGISTER TO CLEAR ALL CACHES
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
            });
        }

        // Reset eventuale view mode precedente
        sessionStorage.removeItem('green_enerbras_view_mode');

        // Se c'è ?logout=true nell'URL, forza il logout
        if (window.location.search.includes('logout=true')) {
            localStorage.removeItem('green_enerbras_auth_user');
            if (typeof Auth !== 'undefined') Auth.currentUser = null;
        }

        // Se l'utente è già loggato (e non ha richiesto logout), reindirizzalo
        if (typeof Auth !== 'undefined' && Auth.currentUser && !window.location.search.includes('logout=true')) {
            if (Auth.currentUser.role === 'admin') {
                window.location.href = 'admin/index.html';
            } else {
                window.location.href = 'user/dashboard.html';
            }
        }

                // Toggle password visibility
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.style.display = 'none';
            btn.textContent = 'Verifica in corso...';
            btn.disabled = true;

            try {
                if (typeof Auth === 'undefined') {
                    throw new Error("Il modulo Auth non e' stato caricato. Verifica la connessione internet (Firebase SDK).");
                }
                const result = await Auth.login(user, pass);
                if (result.success) {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin/index.html';
                    } else {
                        window.location.href = 'user/dashboard.html';
                    }
                } else {
                    errorDiv.textContent = result.error;
                    errorDiv.style.display = 'block';
                    btn.textContent = 'Accedi al Portale';
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Errore Javascript catturato: " + err.message);
                errorDiv.textContent = "Errore imprevisto JS: " + err.message;
                errorDiv.style.display = 'block';
                btn.textContent = 'Accedi al Portale';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
