<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem;">
                <img src="Loghi/Green Enerbras solo logo.png" alt="Logo" style="height: 55px; filter: grayscale(1) invert(1) brightness(10); mix-blend-mode: screen;">
                <h2 style="margin: 0; font-size: 1.1rem;">GREEN ENERBRAS ONE</h2>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item" data-i18n="nav_azionariato"><i class="fa-solid fa-chart-pie"></i> Azionariato (LPs)</a>
                <a href="#" class="nav-item active" data-i18n="nav_conto"><i class="fa-solid fa-building-columns"></i> Conto Bancario</a>
                <a href="produzione.html" class="nav-item" data-i18n="nav_produzione"><i class="fa-solid fa-solar-panel"></i> Produzione Energia</a>
                <a href="vendite.html" class="nav-item" data-i18n="nav_vendite"><i class="fa-solid fa-money-bill-trend-up"></i> Vendite Energia</a>
                <a href="impianti.html" class="nav-item" data-i18n="nav_impianti"><i class="fa-solid fa-map-location-dot"></i> Impianti e Mappa</a>
                <a href="reporting.html" class="nav-item" data-i18n="nav_reporting"><i class="fa-solid fa-file-pdf"></i> Reporting Partners</a>
                <a href="tristar.html" class="nav-item" data-i18n="nav_tristar"><i class="fa-solid fa-file-contract"></i> TRI STAR</a>
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 1rem 0;"></div>
                <a href="strumenti.html" class="nav-item" data-i18n="nav_strumenti"><i class="fa-solid fa-toolbox"></i> Strumenti</a>
                
                <a href="risultati.html" class="nav-item active">
                    <i class="fa-solid fa-chart-line"></i>
                    <span data-i18n="menu_risultati">Risultati</span>
                </a>
                <a href="../user/dashboard.html" class="nav-item" style="color: #3b82f6; margin-top: 1rem; border: 1px dashed #3b82f6; justify-content: center;" data-i18n="nav_switch_user"><i class="fa-solid fa-right-left"></i> Switch to USER</a>
                <a href="#" onclick="Auth.logout()" class="nav-item" style="color: #ef4444; margin-top: 1rem; justify-content: center;" data-i18n="nav_logout"><i class="fa-solid fa-right-from-bracket"></i> Esci</a>
            <div class="update-info">
                <p data-i18n="last_updated">Ultimo aggiornamento:</p>
                <p id="last-updated" class="text-bold">--/--/----</p>
                <button class="btn-refresh" onclick="if(window.location.hostname==='localhost'){if(window.location.hostname==='localhost'){fetch('http://localhost:8081/update').then(function(r){window.location.reload()}).catch(function(){alert('Errore: Il server locale non è avviato.')})}else{window.location.reload(true)}}else{window.location.reload(true)}" data-i18n="btn_refresh"><i class="fa-solid fa-rotate-right"></i> Ricarica Dati</button>
            </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 data-i18n="title_risultati">Risultati</h1>
                
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <div class="lang-selector" style="display: flex; gap: 0.5rem; align-items: center;">
                        <img src="https://flagcdn.com/w40/it.png" alt="IT" data-lang="it" class="lang-flag" style="width: 24px; height: 24px; border-radius: 50%; cursor: pointer; object-fit: cover;">
                        <img src="https://flagcdn.com/w40/gb.png" alt="EN" data-lang="en" class="lang-flag" style="width: 24px; height: 24px; border-radius: 50%; cursor: pointer; object-fit: cover;">
                        <img src="https://flagcdn.com/w40/fr.png" alt="FR" data-lang="fr" class="lang-flag" style="width: 24px; height: 24px; border-radius: 50%; cursor: pointer; object-fit: cover;">
                    </div>
                    <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=3b82f6&color=fff" alt="Admin" class="avatar">
                    <span>Edoardo Tubia (Admin)</span>
                </div>
                </div>
            </header>

            

            <!-- Bank Movements -->
            
            <section class="dashboard-grid" style="grid-template-columns: 1fr; margin-top: 2rem;">
                <div class="glass-panel" style="grid-column: 1 / -1; min-height: 500px; position: relative;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                        <h2 style="margin: 0;" data-i18n="title_risultati">Risultati</h2>
                        
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <label style="color: white; font-weight: bold;" data-i18n="filter_anno">Anno</label>
                            <select id="filter-year" class="filter-input" style="padding: 0.5rem; border-radius: 8px;">
                                <option value="all" data-i18n="filter_tutti_anni">Tutti gli anni</option>
                            </select>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs-container" style="display: flex; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 1.5rem;">
                        <button class="tab-btn active" onclick="switchTab('tab-ricavi-costi')" style="background: none; border: none; color: white; padding: 1rem 2rem; cursor: pointer; border-bottom: 3px solid #10b981; font-weight: bold;" data-i18n="tab_ricavi_costi">Costi e Ricavi</button>
                        <button class="tab-btn" onclick="switchTab('tab-capitale')" style="background: none; border: none; color: white; padding: 1rem 2rem; cursor: pointer; border-bottom: 3px solid transparent; opacity: 0.7;" data-i18n="tab_capitale">Capitale e Immobilizzazioni</button>
                    </div>

                    <!-- Tab Content 1: Costi / Ricavi -->
                    <div id="tab-ricavi-costi" class="tab-content" style="display: block;">
                        <div class="table-container" style="overflow-x: auto;">
                            <table style="width: 100%; color: white; border-collapse: collapse; min-width: 800px;">
                                <thead style="background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);">
                                    <tr>
                                        <th style="padding: 1rem; text-align: left;"><span data-i18n="table_tipologia">Tipologia</span></th>
                                        <th style="padding: 1rem; text-align: right;"><span data-i18n="table_importo">Importo (€)</span></th>
                                    </tr>
                                </thead>
                                <tbody id="table-body-ricavi-costi">
                                    <!-- Injected via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Tab Content 2: Capitale / Immobilizzazioni -->
                    <div id="tab-capitale" class="tab-content" style="display: none;">
                        
                        <div class="table-container" style="overflow-x: auto;">
                            <table style="width: 100%; color: white; border-collapse: collapse; min-width: 800px;">
                                <thead style="background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);">
                                    <tr>
                                        <th style="padding: 1rem; text-align: left;"><span data-i18n="table_tipologia">Tipologia</span></th>
                                        <th style="padding: 1rem; text-align: right;"><span data-i18n="table_importo">Importo (€)</span></th>
                                    </tr>
                                </thead>
                                <tbody id="table-body-capitale">
                                    <!-- Injected via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
